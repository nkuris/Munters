services:
  munters.server:
    build:
      context: .
      dockerfile: Munters.Server/Dockerfile
    image: muntersserver:dev
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # WARNING: the API key is embedded here for local compose runs. Do NOT commit this change if you want to keep
      # the key secret. Prefer using a .env file or docker-compose.override.yml excluded from source control.
      - Giphy__ApiKey=XZghbdUGNTKfaEqZ7TDgbe5SVvAJHsgV
      - Cors__AllowedOrigins=${Cors__AllowedOrigins:-http://localhost:3000,http://munters.client:80}
    restart: unless-stopped
    networks:
      - muntersnet

  munters.client:
    build:
      context: ./munters.client
      dockerfile: Dockerfile
    image: muntersclient:dev
    ports:
      - "3000:80"
    depends_on:
      - munters.server
    restart: unless-stopped
    networks:
      - muntersnet

networks:
  muntersnet:
    driver: bridge
